# Keycloak's own login page, minus the styling that gets in the journey's way.
#
# `base` is Keycloak's unstyled login theme: plain markup, same form, same
# endpoints. The shipped `keycloak` theme wraps every field label in a
# PatternFly <span> with the text on its own line, so an anchored locator like
# `getByLabel(/^password$/i)` — which the reference's sso.spec.ts uses to reach
# the password FIELD — matches nothing at all.
parent=base
