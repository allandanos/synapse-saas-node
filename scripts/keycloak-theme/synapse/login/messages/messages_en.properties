# Keycloak's password-visibility toggle is labelled "Show password"/"Hide
# password". `getByLabel(/password/i)` — the locator the reference's
# sso.spec.ts used before it was anchored — then matches the toggle as well as
# the field and trips Playwright's strict mode. Relabel the button; the field
# keeps its own "Password".
showPassword=Reveal the entered characters
hidePassword=Conceal the entered characters
