# Keycloak's password-visibility toggle is labelled "Show password"/"Hide
# password", which makes `getByLabel(/password/i)` — what the reference's
# sso.spec.ts uses to reach the password FIELD — match two elements and fail
# Playwright's strict mode. Relabel the button; the field keeps "Password".
showPassword=Reveal the entered characters
hidePassword=Conceal the entered characters
